name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, core, integration, migration, browser, mini]
    env:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Verify browser availability
        if: matrix.suite == 'browser'
        run: |
          test -x "$PUPPETEER_EXECUTABLE_PATH"
          readlink -f "$PUPPETEER_EXECUTABLE_PATH"
          "$PUPPETEER_EXECUTABLE_PATH" --version
      - name: Check release contents
        if: matrix.suite == 'unit'
        run: npm run check:release
      - run: node scripts/test.mjs ${{ matrix.suite }}
      - run: npm run verify --prefix wechat-miniprogram
        if: matrix.suite == 'mini'
