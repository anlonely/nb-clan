# Current-file release scanning. All upstream rules remain enabled.
# Exceptions require BOTH a reviewed file and exact known non-secret content.
# Do not add directory-wide exclusions or real credentials here.
title = "NB Clan public source"
[extend]
useDefault = true

[[allowlists]]
description = "Generated manifest SHA-256 digests, not API tokens"
targetRules = ["generic-api-key", "discord-api-token"]
condition = "AND"
paths = ['''(?:^|/)PUBLIC-RELEASE-MANIFEST\.json$''']
regexTarget = "secret"
regexes = ['''^[a-f0-9]{64}$''']

[[allowlists]]
description = "Translation label or message identifier misread as Discord secret"
targetRules = ["discord-client-secret"]
condition = "AND"
paths = ['''(?:^|/)server/api\.js$''']
regexTarget = "secret"
regexes = [
  '''^wipeAttendanceCommandDescription$''',
]

[[allowlists]]
description = "Translation label or message identifier misread as Discord secret"
targetRules = ["discord-client-secret"]
condition = "AND"
paths = ['''(?:^|/)src/i18n/copy\-data/en\.js$''']
regexTarget = "secret"
regexes = [
  '''^discordMemberApplicationFeedback$''',
  '''^discordMemberApplicationNeedMore$''',
  '''^riskRuleDefaultAccountRestricted$''',
  '''^rustplusRelayForwardPlatformKook$''',
