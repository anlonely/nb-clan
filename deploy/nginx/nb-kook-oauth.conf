# Include inside your HTTPS server block, before other regex locations.
# Exclude authorization codes and one-time tickets from Nginx logs.
location ~ ^/api/(?:auth/(?:kook/(?:callback|finish|steam/callback)|(?:discord|steam)/callback)|v2/auth/(?:(?:discord|kook)/(?:callback|finish)|steam/(?:callback|login-callback)))$ {
    limit_except GET { deny all; }
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' https://open.er-api.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    proxy_hide_header Referrer-Policy;
    access_log off;
    error_log /dev/null;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 45s;
}
